version: 2

models:
  - name: stg_mock_profiles
    description: "Mock profiles for AI validation"
    columns:
      - name: job_title
        tests:
          - cortex_validation:
              rules: "The job title must be a realistic professional role. Flag anything that sounds suspicious or fun-only (e.g., 'Astronaut at Pizza Hut')."
              confidence_threshold: 0.8
              mode: 'ai_full'
              row_limit: 10

  - name: stg_orders
    description: "Staged orders"
    columns:
      - name: order_key
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              values: ['F', 'O', 'P']

  - name: stg_lineitem
    description: "Staged lineitems"
    columns:
      - name: line_item_key
        tests:
          - not_null
          - unique
      - name: return_flag
        tests:
          - accepted_values:
              values: ['R', 'A', 'N']
      - name: status
        tests:
          - accepted_values:
              values: ['O', 'F']

  - name: stg_customers
    description: "Staged customers"
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

  - name: stg_part
    description: "Staged parts"
    columns:
      - name: part_key
        tests:
          - not_null
          - unique

  - name: stg_supplier
    description: "Staged suppliers"
    columns:
      - name: supplier_key
        tests:
          - not_null
          - unique

  - name: stg_partsupp
    description: "Staged part suppliers"
    columns:
      - name: part_supplier_key
        tests:
          - not_null
          - unique

  - name: stg_nation
    description: "Staged nations"
    columns:
      - name: nation_key
        tests:
          - not_null
          - unique

  - name: stg_region
    description: "Staged regions"
    columns:
      - name: region_key
        tests:
          - not_null
          - unique
